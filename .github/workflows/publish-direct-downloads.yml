name: Publish direct Readdy downloads

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "electron/**"
      - "index.html"
      - "landing.html"
      - "french-library.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/publish-direct-downloads.yml"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build installer
        run: npm run dist
      - name: Upload installer for release
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 2

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html landing.html french-library.html www/
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK for stable direct link
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Readdy-3-Android.apk
      - name: Upload APK for release
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Readdy-3-Android.apk
          if-no-files-found: error
          retention-days: 2

  release:
    name: Publish permanent direct-download links
    runs-on: ubuntu-latest
    needs:
      - windows
      - android
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Rename Windows installer to stable filename
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*.exe)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one Windows installer, found ${#files[@]}"
            exit 1
          fi
          mv "${files[0]}" release-assets/Readdy-3-Windows.exe
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: readdy-build-${{ github.run_number }}
          name: Readdy 3 — Build ${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/Readdy-3-Windows.exe
            release-assets/Readdy-3-Android.apk
