<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jomo AI — المساعد الذكي الموحد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg-main: #131314;
      --bg-sidebar: #18191A;
      --bg-surface: #1E1F20;
      --bg-surface-hover: #282A2C;
      --bg-input: #1E1F20;
      --bg-code: #0E0F10;
      --border-subtle: #2C2D2F;
      --border-strong: #3C3E42;
      --text-primary: #E3E3E3;
      --text-secondary: #9AA0A6;
      --text-muted: #6E7378;
      --accent-solid: #E3E3E3;
      --accent-text: #131314;
      --badge-bg: #252628;
      --danger: #D96B6B;
      --success: #6BBF8A;
      --font-sans: 'IBM Plex Sans Arabic', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      --transition: 0.18s ease;
    }

    body.light-theme {
      --bg-main: #F9F9F8;
      --bg-sidebar: #F2F2F0;
      --bg-surface: #FFFFFF;
      --bg-surface-hover: #EAEAE7;
      --bg-input: #FFFFFF;
      --bg-code: #F4F4F2;
      --border-subtle: #E2E2DF;
      --border-strong: #CECEC9;
      --text-primary: #1A1A1A;
      --text-secondary: #5C5C5A;
      --text-muted: #8C8C88;
      --accent-solid: #1A1A1A;
      --accent-text: #FFFFFF;
      --badge-bg: #EBEBE8;
      --danger: #B84242;
      --success: #3B8757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.65;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .sidebar {
      width: 272px;
      background-color: var(--bg-sidebar);
      border-inline-end: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      transition: width var(--transition), transform var(--transition);
      flex-shrink: 0;
      z-index: 30;
    }

    .sidebar.collapsed {
      width: 0;
      border-inline-end: none;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .new-chat-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--transition), border-color var(--transition);
    }

    .new-chat-btn:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-strong);
    }

    .sidebar-search {
      padding: 0 16px 12px;
    }

    .sidebar-search input {
      width: 100%;
      background-color: var(--bg-main);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .sidebar-search input:focus {
      border-color: var(--border-strong);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 10px 10px 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13.5px;
      cursor: pointer;
      transition: background-color var(--transition), color var(--transition);
      gap: 8px;
    }

    .chat-item:hover, .chat-item.active {
      background-color: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .chat-item-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item-actions {
      display: none;
      align-items: center;
      gap: 4px;
    }

    .chat-item:hover .chat-item-actions {
      display: flex;
    }

    .mini-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-icon-btn:hover {
      color: var(--text-primary);
      background-color: var(--bg-surface);
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-footer-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13.5px;
      cursor: pointer;
      text-align: start;
      transition: background-color var(--transition), color var(--transition);
    }

    .sidebar-footer-btn:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .workspace {
      flex: 1;
      display: flex;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 340px;
      background-color: var(--bg-main);
    }

    .topbar {
      height: 58px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--transition), color var(--transition), border-color var(--transition);
    }

    .icon-btn:hover {
      background-color: var(--bg-surface);
      color: var(--text-primary);
    }

    .brand-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background-color: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      position: relative;
    }

    .brand-selector:hover {
      background-color: var(--bg-surface);
    }

    .model-tag {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background-color: var(--badge-bg);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-action-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--transition), border-color var(--transition);
    }

    .pill-action-btn:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-strong);
    }

    .pill-action-btn.active {
      background-color: var(--accent-solid);
      color: var(--accent-text);
      border-color: var(--accent-solid);
    }

    .dropdown-menu {
      position: absolute;
      top: 46px;
      inset-inline-start: 0;
      width: 270px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 50;
    }

    .dropdown-menu.open {
      display: flex;
    }

    .dropdown-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      cursor: pointer;
      text-align: start;
      width: 100%;
    }

    .dropdown-item:hover, .dropdown-item.selected {
      background-color: var(--bg-surface-hover);
    }

    .dropdown-item-title {
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .dropdown-item-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }

    .messages-inner {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
      flex: 1;
    }

    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
      margin: auto 0;
    }

    .jomo-mark {
      width: 44px;
      height: 44px;
      border: 1.5px solid var(--text-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .welcome-title {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .welcome-subtitle {
      font-size: 14.5px;
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 32px;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 640px;
    }

    .suggestion-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      text-align: start;
      cursor: pointer;
      transition: background-color var(--transition), border-color var(--transition);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .suggestion-card:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-strong);
    }

    .suggestion-card-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .suggestion-card-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .message-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .message-row.user {
      align-items: flex-end;
    }

    .user-bubble {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      max-width: 82%;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
      justify-content: flex-end;
    }

    .user-attachments img {
      max-width: 220px;
      max-height: 180px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      object-fit: cover;
    }

    .file-chip-display {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .assistant-block {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      width: 100%;
    }

    .assistant-avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background-color: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--text-primary);
    }

    .assistant-content {
      flex: 1;
      min-width: 0;
      color: var(--text-primary);
    }

    .thinking-box {
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .thinking-header {
      padding: 8px 12px;
      font-size: 12.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .thinking-header:hover {
      background-color: var(--bg-surface-hover);
    }

    .thinking-body {
      padding: 10px 14px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      color: var(--text-secondary);
      white-space: pre-wrap;
      display: none;
    }

    .thinking-box.open .thinking-body {
      display: block;
    }

    .markdown-body p { margin-bottom: 12px; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul, .markdown-body ol { margin: 8px 0 12px; padding-inline-start: 22px; }
    .markdown-body li { margin-bottom: 4px; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: 18px 0 8px; font-weight: 600; line-height: 1.35; }
    .markdown-body h1 { font-size: 1.35em; }
    .markdown-body h2 { font-size: 1.2em; }
    .markdown-body h3 { font-size: 1.08em; }
    .markdown-body blockquote {
      border-inline-start: 2px solid var(--border-strong);
      padding-inline-start: 14px;
      color: var(--text-secondary);
      margin: 12px 0;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 13.5px;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      text-align: start;
    }
    .markdown-body th {
      background-color: var(--bg-surface);
      font-weight: 600;
    }
    .markdown-body code:not(pre code) {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 0.88em;
    }

    .code-wrapper {
      background-color: var(--bg-code);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      margin: 14px 0;
      overflow: hidden;
      direction: ltr;
      text-align: left;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .code-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .code-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 3px 9px;
      border-radius: 5px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .code-btn:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .code-wrapper pre {
      margin: 0;
      padding: 14px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.55;
    }

    .generated-image-card {
      margin-top: 10px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      background-color: var(--bg-surface);
      max-width: 480px;
    }

    .generated-image-card img {
      width: 100%;
      display: block;
    }

    .generated-image-footer {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-subtle);
    }

    .sources-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .source-pill {
      font-size: 11.5px;
      color: var(--text-secondary);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-pill:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
    }

    .input-section {
      padding: 12px 20px 18px;
      background-color: var(--bg-main);
    }

    .input-wrapper {
      max-width: 780px;
      margin: 0 auto;
      background-color: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color var(--transition);
    }

    .input-wrapper:focus-within {
      border-color: var(--text-secondary);
    }

    .attachments-preview {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 4px;
    }

    .attachments-preview.has-items {
      display: flex;
    }

    .preview-item {
      position: relative;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background-color: var(--bg-main);
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 6p
