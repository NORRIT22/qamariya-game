<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHESS PRO — منصة الشطرنج الكاملة</title>
  <style>
    :root {
      --bg-dark: #302e2b;
      --bg-darker: #262421;
      --bg-panel: #21201d;
      --border-color: #3d3b37;
      --board-light: #eeeed2;
      --board-dark: #769656;
      --highlight-move: rgba(255, 255, 51, 0.45);
      --highlight-check: radial-gradient(circle, rgba(255,0,0,0.85) 0%, rgba(255,0,0,0) 75%);
      --accent-green: #81b64c;
      --accent-green-hover: #95cc5c;
      --text-main: #f5f5f5;
      --text-muted: #9e9b95;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      display: grid;
      grid-template-columns: 36px minmax(300px, 560px) 340px;
      gap: 16px;
      max-width: 1020px;
      width: 100%;
      align-items: stretch;
    }

    /* Evaluation Bar */
    .eval-bar-wrapper {
      background-color: #1a1917;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border: 1px solid var(--border-color);
    }

    .eval-fill-black {
      background-color: #403d39;
      width: 100%;
      height: 50%;
      transition: height 0.4s ease;
    }

    .eval-fill-white {
      background-color: #f0f0f0;
      width: 100%;
      flex: 1;
    }

    .eval-score {
      position: absolute;
      width: 100%;
      text-align: center;
      font-family: monospace;
      font-size: 0.72rem;
      font-weight: 700;
      z-index: 2;
      padding: 4px 0;
    }
    .eval-score.top { top: 2px; color: #f0f0f0; }
    .eval-score.bottom { bottom: 2px; color: #1a1917; }

    /* Main Board Column */
    .board-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-darker);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background-color: #3d3b37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .player-name { font-weight: 700; font-size: 0.95rem; }
    .player-elo { font-family: monospace; font-size: 0.8rem; color: var(--text-muted); margin-right: 6px; }
    .captured-row { display: flex; align-items: center; gap: 2px; height: 20px; font-size: 0.9rem; color: #ccc; }
    .mat-diff { font-family: monospace; font-size: 0.75rem; color: var(--accent-green); margin-right: 4px; }

    .clock {
      font-family: monospace;
      font-size: 1.35rem;
      font-weight: 700;
      background-color: #1b1a18;
      padding: 6px 14px;
      border-radius: 6px;
      color: var(--text-muted);
      min-width: 92px;
      text-align: center;
    }

    .clock.active { background-color: #fff; color: #1b1a18; }
    .clock.low-time { background-color: #b33430; color: #fff; }

    /* Chessboard Grid */
    .board-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .chessboard {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
      direction: ltr;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .square.light { background-color: var(--board-light); }
    .square.dark { background-color: var(--board-dark); }
    .square.last-move::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--highlight-move);
      pointer-events: none;
    }
    .square.selected::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: rgba(255, 255, 51, 0.55);
      pointer-events: none;
    }
    .square.in-check { background: var(--highlight-check), var(--board-light); }
    .square.dark.in-check { background: var(--highlight-check), var(--board-dark); }

    .coord-rank {
      position: absolute;
      top: 3px;
      left: 4px;
      font-family: monospace;
      font-size: 0.68rem;
      font-weight: 700;
      pointer-events: none;
    }
    .coord-file {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-family: monospace;
      font-size: 0.68rem;
      font-weight: 700;
      pointer-events: none;
    }
    .light .coord-rank, .light .coord-file { color: var(--board-dark); }
    .dark .coord-rank, .dark .coord-file { color: var(--board-light); }

    .hint-dot {
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.2);
      z-index: 3;
      pointer-events: none;
    }
    .hint-capture {
      position: absolute;
      inset: 6%;
      border-radius: 50%;
      border: 5px solid rgba(0, 0, 0, 0.22);
      z-index: 3;
      pointer-events: none;
    }

    .piece {
      width: 84%;
      height: 84%;
      z-index: 4;
      pointer-events: none;
    }

    /* Promotion Modal */
    .promo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .promo-box {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 10px;
    }
    .promo-choice {
      width: 64px;
      height: 64px;
      background: #33312d;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .promo-choice:hover { background: var(--accent-green); }

    /* Right Sidebar Panel */
    .sidebar {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 16px;
      background-color: var(--bg-darker);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title { font-weight: 700; font-size: 1rem; }
    .status-banner {
      padding: 10px 14px;
      background-color: #2c2a26;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-green);
      text-align: center;
    }

    .setup-controls {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    select {
      background-color: #2c2a26;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }

    .move-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      min-height: 220px;
      max-height: 340px;
      direction: ltr;
    }

    .move-row {
      display: grid;
      grid-template-columns: 44px 1fr 1fr;
      padding: 4px 14px;
      font-family: monospace;
      font-size: 0.88rem;
    }
    .move-row:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
    .move-num { color: var(--text-muted); }
    .move-cell { color: var(--text-main); padding: 2px 6px; border-radius: 4px; }
    .move-cell.latest { background-color: rgba(129, 182, 76, 0.25); font-weight: 700; }

    .panel-actions {
      padding: 14px;
      background-color: var(--bg-darker);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    button {
      background-color: #33312d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background-color: #403e39; }
    button.primary {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
      color: #fff;
      font-size: 1rem;
    }
    button.primary:hover { background-color: var(--accent-green-hover); }

    @media (max-width: 900px) {
      .app-container { grid-template-columns: 24px 1fr; }
      .sidebar { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Engine Evaluation Bar -->
    <div class="eval-bar-wrapper">
      <div class="eval-score top" id="eval-top"></div>
      <div class="eval-fill-black" id="eval-black"></div>
      <div class="eval-fill-white"></div>
      <div class="eval-score bottom" id="eval-bottom">0.0</div>
    </div>

    <!-- Center Board Section -->
    <div class="board-section">
      <div class="player-bar">
        <div class="player-info">
          <div class="avatar" id="top-avatar">🤖</div>
          <div>
            <div><span class="player-name" id="top-name">Stockfish Engine</span><span class="player-elo" id="top-elo">1500</span></div>
            <div class="captured-row" id="top-captured"></div>
          </div>
        </div>
        <div class="clock" id="top-clock">10:00</div>
      </div>

      <div class="board-wrapper">
        <div class="chessboard" id="board"></div>
        <div class="promo-overlay" id="promo-modal">
          <div class="promo-box" id="promo-choices"></div>
        </div>
      </div>

      <div class="player-bar">
        <div class="player-info">
          <div class="avatar">♟️</div>
          <div>
            <div><span class="player-name" id="bottom-name">Norri2201</span><span class="player-elo" id="bottom-elo">1500</span></div>
            <div class="captured-row" id="bottom-captured"></div>
          </div>
        </div>
        <div class="clock active" id="bottom-clock">10:00</div>
      </div>
    </div>

    <!-- Right Control & PGN Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">♟️ تحليل ولعب مباشر</div>
        <span style="font-family:monospace; font-size:0.78rem; color:#81b64c;" id="opening-label">Opening</span>
      </div>

      <div class="status-banner" id="game-status">انقر على أي قطعة بيضاء للبدء</div>

      <div class="setup-controls">
        <select id="mode-select">
          <option value="ai-2" selected>ضد المحرك — متوسط (1500)</option>
          <option value="ai-1">ضد المحرك — مبتدئ (1100)</option>
          <option value="ai-3">ضد المحرك — قوي (1800)</option>
          <option value="pvp">لاعب ضد لاعب (محلي)</option>
        </select>

        <select id="time-select">
          <option value="600" selected>Rapid 10 دقيقة</option>
          <option value="300">Blitz 5 دقائق</option>
          <option value="180">Blitz 3 دقائق</option>
          <option value="60">Bullet 1 دقيقة</option>
        </select>
      </div>

      <div class="move-list" id="move-list"></div>

      <div class="panel-actions">
        <button class="primary" id="btn-new">مباراة جديدة</button>
        <div class="btn-row">
          <button id="btn-undo">↩ تراجع</button>
          <button id="btn-flip">⇅ قلب الرقعة</button>
        </div>
        <div class="btn-row">
          <button id="btn-pgn">📋 نسخ PGN</button>
          <button id="btn-resign">🏳️ استسلام</button>
        </div>
      </div>
    </div>
  </div>

  const FILES = ['a','b','c','d','e','f','g','h'];
  const PIECE_VALUES = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000 };

  const PST = {
    P: [[0,0,0,0,0,0,0,0],[50,50,50,50,50,50,50,50],[10,10,20,30,30,20,10,10],[5,5,10,25,25,10,5,5],[0,0,0,20,20,0,0,0],[5,-5,-10,0,0,-10,-5,5],[5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]],
    N: [[-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,0,0,0,0,-20,-40],[-30,0,10,15,15,10,0,-30],[-30,5,15,20,20,15,5,-30],[-30,0,15,20,20,15,0,-30],[-30,5,10,15,15,10,5,-30],[-40,-20,0,5,5,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]],
    B: [[-20,-10,-10,-10,-10,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,10,10,5,0,-10],[-10,5,5,10,10,5,5,-10],[-10,0,10,10,10,10,0,-10],[-10,10,10,10,10,10,10,-10],[-10,5,0,0,0,0,5,-10],[-20,-10,-10,-10,-10,-10,-10,-20]],
    R: [[0,0,0,0,0,0,0,0],[5,10,10,10,10,10,10,5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[0,0,0,5,5,0,0,0]],
    Q: [[-20,-10,-10,-5,-5,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,5,5,5,0,-10],[-5,0,5,5,5,5,0,-5],[0,0,5,5,5,5,0,-5],[-10,5,5,5,5,5,0,-10],[-10,0,5,0,0,0,0,-10],[-20,-10,-10,-5,-5,-10,-10,-20]],

  class ChessEngine {
    constructor() { this.reset(); }
    reset() {
      this.board = [
        ['bR','bN','bB','bQ','bK','bB','bN','bR'],
        ['bP','bP','bP','bP','bP','bP','bP','bP'],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        ['wP','wP','wP','wP','wP','wP','wP','wP'],
        ['wR','wN','wB','wQ','wK','wB','wN','wR']
      ];
      this.turn = 'w';
      this.castling = { wK: true, wQ: true, bK: true, bQ: true };
      this.epTarget = null;
      this.history = [];
      this.pgnMoves = [];
      this.gameOver = false;
      this.resultText = '';
    }
    cloneState() {
      return {
        board: this.board.map(r => [...r]),
        turn: this.turn,
        castling: { ...this.castling },
        epTarget: this.epTarget ? { ...this.epTarget } : null
      };
    }
    restoreState(st) {
      this.board = st.board.map(r => [...r]);
      this.turn = st.turn;
      this.castling = { ...st.castling };
      this.epTarget = st.epTarget ? { ...st.epTarget } : null;
    }
    inBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
    isSquareAttacked(r, c, byColor) {
      const pawnDir = byColor === 'w' ? 1 : -1;
      for (const dc of [-1, 1]) {
        const pr = r + pawnDir, pc = c + dc;
        if (this.inBounds(pr, pc) && this.board[pr][pc] === byColor + 'P') return true;
      }
      for (const [dr, dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
        const nr = r + dr, nc = c + dc;
        if (this.inBounds(nr, nc) && this.board[nr][nc] === byColor + 'N') return true;
      }
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const kr = r + dr, kc = c + dc;
          if (this.inBounds(kr, kc) && this.board[kr][kc] === byColor + 'K') return true;
        }
      }
      for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        let nr = r + dr, nc = c + dc;
        while (this.inBounds(nr, nc)) {
          const p = this.board[nr][nc];
          if (p) { if (p[0] === byColor && (p[1] === 'R' || p[1] === 'Q')) return true; break; }
          nr += dr; nc += dc;
        }
      }
      for (const [dr, dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
        let nr = r + dr, nc = c + dc;
        while (this.inBounds(nr, nc)) {
          const p = this.board[nr][nc];
          if (p) { if (p[0] === byColor && (p[1] === 'B' || p[1] === 'Q')) return true; break; }
          nr += dr; nc += dc;
        }
      }
      return false;
    }
    findKing(color) {
      for (let r = 0; r < 8; r++)
        for (let c = 0; c < 8; c++)
          if (this.board[r][c] === color + 'K') return { r, c };
      return null;
    }
    isInCheck(color) {
      const k = this.findKing(color);
      return k ? this.isSquareAttacked(k.r, k.c, color === 'w' ? 'b' : 'w') : false;
    }
    generatePseudoMoves(r, c) {
      const piece = this.board[r][c];
      if (!piece) return [];
      const color = piece[0], type = piece[1], enemy = color === 'w' ? 'b' : 'w';
      const moves = [];
      const push = (toR, toC, extra = {}) => moves.push({ fromR: r, fromC: c, toR, toC, piece, captured: this.board[toR][toC], ...extra });

      if (type === 'P') {
        const dir = color === 'w' ? -1 : 1, startRow = color === 'w' ? 6 : 1, promoRow = color === 'w' ? 0 : 7;
        if (this.inBounds(r + dir, c) && !this.board[r + dir][c]) {
          if (r + dir === promoRow) ['Q','R','B','N'].forEach(p => push(r + dir, c, { promotion: p }));
          else {
            push(r + dir, c);
            if (r === startRow && !this.board[r + dir * 2][c]) push(r + dir * 2, c, { doublePawn: true });
          }
        }
        for (const dc of [-1, 1]) {
          const nr = r + dir, nc = c + dc;
          if (!this.inBounds(nr, nc)) continue;
          const target = this.board[nr][nc];
          if (target && target[0] === enemy) {
            if (nr === promoRow) ['Q','R','B','N'].forEach(p => push(nr, nc, { promotion: p }));
            else push(nr, nc);
          } else if (this.epTarget && this.epTarget.r === nr && this.epTarget.c === nc) {
            push(nr, nc, { enPassant: true, captured: enemy + 'P' });
          }
        }
      } else if (type === 'N') {
        for (const [dr, dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
          const nr = r + dr, nc = c + dc;
          if (this.inBounds(nr, nc) && (!this.board[nr][nc] || this.board[nr][nc][0] === enemy)) push(nr, nc);
        }
      } else if (type === 'K') {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue;
            const nr = r + dr, nc = c + dc;
            if (this.inBounds(nr, nc) && (!this.board[nr][nc] || this.board[nr][nc][0] === enemy)) push(nr, nc);
          }
        }
        const homeRow = color === 'w' ? 7 : 0;
        if (r === homeRow && c === 4 && !this.isInCheck(color)) {
          if (this.castling[color + 'K'] && !this.board[homeRow][5] && !this.board[homeRow][6] &&
              !this.isSquareAttacked(homeRow, 5, enemy) && !this.isSquareAttacked(homeRow, 6, enemy)) push(homeRow, 6, { castling: 'K' });
          if (this.castling[color + 'Q'] && !this.board[homeRow][3] && !this.board[homeRow][2] && !this.board[homeRow][1] &&
              !this.isSquareAttacked(homeRow, 3, enemy) && !this.isSquareAttacked(homeRow, 2, enemy)) push(homeRow, 2, { castling: 'Q' });
        }
      } else {
        const dirs = [];
        if (type === 'R' || type === 'Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
        if (type === 'B' || type === 'Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
        for (const [dr, dc] of dirs) {
          let nr = r + dr, nc = c + dc;
          while (this.inBounds(nr, nc)) {
            const target = this.board[nr][nc];
            if (!target) push(nr, nc);
            else { if (target[0] === enemy) push(nr, nc); break; }
            nr += dr; nc += dc;
          }
        }
      }
      return moves;
    }
    getLegalMovesForSquare(r, c) {
      const piece = this.board[r][c];
      if (!piece || piece[0] !== this.turn) return [];
      return this.generatePseudoMoves(r, c).filter(m => {
        const snap = this.cloneState();
        this.applyRawMove(m);
        const safe = !this.isInCheck(piece[0]);
        this.restoreState(snap);
        return safe;
      });
    }
    getAllLegalMoves(color = this.turn) {
      const all = [];
      for (let r = 0; r < 8; r++)
        for (let c = 0; c < 8; c++)
          if (this.board[r][c] && this.board[r][c][0] === color) all.push(...this.getLegalMovesForSquare(r, c));
      return all;
    }
    applyRawMove(m) {
      const color = m.piece[0], type = m.piece[1];
      this.board[m.toR][m.toC] = m.promotion ? color + m.promotion : m.piece;
      this.board[m.fromR][m.fromC] = null;
      if (m.enPassant) this.board[color === 'w' ? m.toR + 1 : m.toR - 1][m.toC] = null;
      if (m.castling === 'K') { this.board[m.fromR][5] = color + 'R'; this.board[m.fromR][7] = null; }
      else if (m.castling === 'Q') { this.board[m.fromR][3] = color + 'R'; this.board[m.fromR][0] = null; }
      if (type === 'K') { this.castling[color + 'K'] = false; this.castling[color + 'Q'] = false; }
      if (m.fromR === 7 && m.fromC === 0) this.castling.wQ = false;
      if (m.fromR === 7 && m.fromC === 7) this.castling.wK = false;
      if (m.fromR === 0 && m.fromC === 0) this.castling.bQ = false;
      if (m.fromR === 0 && m.fromC === 7) this.castling.bK = false;
      if (m.toR === 7 && m.toC === 0) this.castling.wQ = false;
      if (m.toR === 7 && m.toC === 7) this.castling.wK = false;
      if (m.toR === 0 && m.toC === 0) this.castling.bQ = false;
      if (m.toR === 0 && m.toC === 7) this.castling.bK = false;
      this.epTarget = m.doublePawn ? { r: (m.fromR + m.toR) / 2, c: m.fromC } : null;
      this.turn = color === 'w' ? 'b' : 'w';
    }
    formatSAN(m, isCheck, isMate) {
      if (m.castling === 'K') return isMate ? 'O-O#' : isCheck ? 'O-O+' : 'O-O';
      if (m.castling === 'Q') return isMate ? 'O-O-O#' : isCheck ? 'O-O-O+' : 'O-O-O';
      const type = m.piece[1], dest = FILES[m.toC] + (8 - m.toR);
      let san = type !== 'P' ? type : (m.captured ? FILES[m.fromC] : '');
      if (m.captured) san += 'x';
      san += dest;
      if (m.promotion) san += '=' + m.promotion;
      return san + (isMate ? '#' : isCheck ? '+' : '');
    }
    makeMove(m) {
      const snap = this.cloneState();
      this.applyRawMove(m);
      const inCheck = this.isInCheck(this.turn);
      const nextMoves = this.getAllLegalMoves(this.turn);
      const isMate = inCheck && nextMoves.length === 0;
      const isStalemate = !inCheck && nextMoves.length === 0;
      const san = this.formatSAN(m, inCheck, isMate);
      this.history.push({ state: snap, move: m, san });
      this.pgnMoves.push(san);
      if (isMate) {
        this.gameOver = true;
        this.resultText = this.turn === 'b' ? 'كش ملك! فاز الأبيض (1-0)' : 'كش ملك! فاز الأسود (0-1)';
      } else if (isStalemate) {
        this.gameOver = true;
        this.resultText = 'تعادل بالخنق — Stalemate (½-½)';
      }
      return { san, isCheck, isMate, isStalemate };
    }
    evaluateBoard() {
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = this.board[r][c];
          if (!p) continue;
          const color = p[0], type = p[1], pstRow = color === 'w' ? r : 7 - r;
          const val = PIECE_VALUES[type] + PST[type][pstRow][c];
          score += color === 'w' ? val : -val;
        }
      }
      return score;
    }
    getBestMove(depth) {
      const moves = this.getAllLegalMoves(this.turn);
      if (!moves.length) return null;
      moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));
      const isMax = this.turn === 'w';
      let bestMove = moves[0], bestVal = isMax ? -Infinity : Infinity;
      for (const m of moves) {
        const snap = this.cloneState();
        this.applyRawMove(m);
        const val = this.minimax(depth - 1, -Infinity, Infinity, !isMax);
        this.restoreState(snap);
        if (isMax ? val > bestVal : val < bestVal) { bestVal = val; bestMove = m; }
      }
      return bestMove;
    }
    minimax(depth, alpha, beta, isMax) {
      if (depth === 0) return this.evaluateBoard();
      const moves = this.getAllLegalMoves(this.turn);
      if (!moves.length) return this.isInCheck(this.turn) ? (isMax ? -99999 - depth : 99999 + depth) : 0;
      moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));
      if (isMax) {
        let maxEval = -Infinity;
        for (const m of moves) {
          const snap = this.cloneState();
          this.applyRawMove(m);
          const ev = this.minimax(depth - 1, alpha, beta, false);
          this.restoreState(snap);
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          const snap = this.cloneState();
          this.applyRawMove(m);
          const ev = this.minimax(depth - 1, alpha, beta, true);
          this.restoreState(snap);
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }
  }

  // Safe Sound Player (never crashes if browser blocks audio)
  let audioCtx = null;
  function playSound(type) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      osc.type = type === 'capture' ? 'sawtooth' : type === 'check' ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(type === 'check' ? 520 : 150, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } catch (e) {}
  }

  const engine = new ChessEngine();
  let selectedSquare = null;
  let legalMovesForSelected = [];
  let flipped = false;
  let whiteTime = 600;
  let blackTime = 600;
  let timerInterval = null;
  let aiThinking = false;

  const boardEl = document.getElementById('board');
  const OPENINGS = {
    'e4 e5 Nf3 Nc6 Bb5': 'Ruy López (الافتتاح الإسباني)',
    'e4 e5 Nf3 Nc6 Bc4': 'Italian Game (الافتتاح الإيطالي)',
    'e4 c5': 'Sicilian Defense (الدفاع الصقلي)',
    'e4 e6': 'French Defense (الدفاع الفرنسي)',
    'e4 c6': 'Caro-Kann Defense (دفاع كارو-كان)',
    'd4 d5 c4': "Queen's Gambit (مناورة الوزير)",
    'd4 Nf6 c4 g6': "King's Indian Defense (الدفاع الهندي الملكي)"
  };

  function detectOpening() {
    const line = engine.pgnMoves.join(' ');
    let matched = 'Opening';
    for (const [seq, name] of Object.entries(OPENINGS)) {
      if (line.startsWith(seq)) matched = name;
    }
    document.getElementById('opening-label').textContent = matched;
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    const lastMove = engine.history.length ? engine.history[engine.history.length - 1].move : null;
    const kingPos = engine.isInCheck(engine.turn) ? engine.findKing(engine.turn) : null;

    for (let i = 0; i < 64; i++) {
      const r = flipped ? 7 - Math.floor(i / 8) : Math.floor(i / 8);
      const c = flipped ? 7 - (i % 8) : (i % 8);
      const sq = document.createElement('div');
      sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;

      if (lastMove && ((lastMove.fromR === r && lastMove.fromC === c) || (lastMove.toR === r && lastMove.toC === c))) sq.classList.add('last-move');
      if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) sq.classList.add('selected');
      if (kingPos && kingPos.r === r && kingPos.c === c) sq.classList.add('in-check');

      if ((!flipped && c === 0) || (flipped && c === 7)) {
        const rankLbl = document.createElement('span');
        rankLbl.className = 'coord-rank';
        rankLbl.textContent = 8 - r;
        sq.appendChild(rankLbl);
      }
      if ((!flipped && r === 7) || (flipped && r === 0)) {
        const fileLbl = document.createElement('span');
        fileLbl.className = 'coord-file';
        fileLbl.textContent = FILES[c];
        sq.appendChild(fileLbl);
      }

      const targetMove = legalMovesForSelected.find(m => m.toR === r && m.toC === c);
      if (targetMove) {
        const hint = document.createElement('div');
        hint.className = targetMove.captured ? 'hint-capture' : 'hint-dot';
        sq.appendChild(hint);
      }

      const piece = engine.board[r][c];
      if (piece) {
        const pWrap = document.createElement('div');
        pWrap.className = 'piece';
        pWrap.innerHTML = PIECE_SVGS[piece];
        sq.appendChild(pWrap);
      }

      sq.addEventListener('click', () => onSquareClick(r, c));
      boardEl.appendChild(sq);
    }
  }

  function onSquareClick(r, c) {
    if (engine.gameOver || aiThinking) return;
    const mode = document.getElementById('mode-select').value;
    if (mode.startsWith('ai') && engine.turn === 'b') return;

    const matchingMoves = legalMovesForSelected.filter(m => m.toR === r && m.toC === c);
    if (matchingMoves.length > 0) {
      if (matchingMoves[0].promotion) showPromotionDialog(matchingMoves);
      else executeMoveAndAdvance(matchingMoves[0]);
      return;
    }

    const clickedPiece = engine.board[r][c];
    if (clickedPiece && clickedPiece[0] === engine.turn) {
      selectedSquare = { r, c };
      legalMovesForSelected = engine.getLegalMovesForSquare(r, c);
    } else {
      selectedSquare = null;
      legalMovesForSelected = [];
    }
    renderBoard();
  }

  function showPromotionDialog(promoMoves) {
    const modal = document.getElementById('promo-modal');
    const choices = document.getElementById('promo-choices');
    choices.innerHTML = '';
    const color = promoMoves[0].piece[0];
    ['Q', 'R', 'B', 'N'].forEach(type => {
      const moveObj = promoMoves.find(m => m.promotion === type);
      const btn = document.createElement('div');
      btn.className = 'promo-choice';
      btn.innerHTML = PIECE_SVGS[color + type];
      btn.onclick = () => { modal.style.display = 'none'; executeMoveAndAdvance(moveObj); };
      choices.appendChild(btn);
    });
    modal.style.display = 'flex';
  }

  function executeMoveAndAdvance(move) {
    const res = engine.makeMove(move);
    selectedSquare = null;
    legalMovesForSelected = [];
    playSound(res.isCheck || res.isMate ? 'check' : move.captured ? 'capture' : 'move');
    updateUI();

    const mode = document.getElementById('mode-select').value;
    if (!engine.gameOver && mode.startsWith('ai') && engine.turn === 'b') {
      aiThinking = true;
      document.getElementById('game-status').textContent = 'المحرك يفكر...';
      const depth = parseInt(mode.split('-')[1], 10);
      setTimeout(() => {
        const aiMove = engine.getBestMove(depth);
        if (aiMove) {
          const aiRes = engine.makeMove(aiMove);
          playSound(aiRes.isCheck || aiRes.isMate ? 'check' : aiMove.captured ? 'capture' : 'move');
        }
        aiThinking = false;
        updateUI();
      }, 200);
    }
  }

  function updateUI() {
    renderBoard();
    updateMoveList();
    updateEvaluationBar();
    updateCapturedPieces();
    detectOpening();

    const statusEl = document.getElementById('game-status');
    if (engine.gameOver) {
      statusEl.textContent = engine.resultText;
      statusEl.style.color = '#e5a93c';
      clearInterval(timerInterval);
    } else {
      statusEl.textContent = engine.turn === 'w' ? 'دور الأبيض للعب' : 'دور الأسود للعب';
      statusEl.style.color = '#81b64c';
    }
    document.getElementById('bottom-clock').classList.toggle('active', engine.turn === 'w' && !engine.gameOver);
    document.getElementById('top-clock').classList.toggle('active', engine.turn === 'b' && !engine.gameOver);
  }

  function updateMoveList() {
    const listEl = document.getElementById('move-list');
    listEl.innerHTML = '';
    for (let i = 0; i < engine.pgnMoves.length; i += 2) {
      const row = document.createElement('div');
      row.className = 'move-row';
      row.innerHTML = `
        <span class="move-num">${Math.floor(i / 2) + 1}.</span>
        <span class="move-cell ${i === engine.pgnMoves.length - 1 ? 'latest' : ''}">${engine.pgnMoves[i] || ''}</span>
        <span class="move-cell ${i + 1 === engine.pgnMoves.length - 1 ? 'latest' : ''}">${engine.pgnMoves[i + 1] || ''}</span>
      `;
      listEl.appendChild(row);
    }
    listEl.scrollTop = listEl.scrollHeight;
  }

  function updateEvaluationBar() {
    const rawCp = engine.evaluateBoard();
    const pawns = (rawCp / 100).toFixed(1);
    const clamped = Math.max(-1000, Math.min(1000, rawCp));
    const whitePct = 50 + (clamped / 1000) * 45;
    document.getElementById('eval-black').style.height = `${100 - whitePct}%`;
    const displayScore = rawCp >= 0 ? `+${pawns}` : `${pawns}`;
    document.getElementById('eval-top').textContent = rawCp < 0 ? displayScore : '';
    document.getElementById('eval-bottom').textContent = rawCp >= 0 ? displayScore : '';
  }

  function updateCapturedPieces() {
    const symbols = { P: '♟', N: '♞', B: '♝', R: '♜', Q: '♛' };
    const vals = { P: 1, N: 3, B: 3, R: 5, Q: 9 };
    let wCaps = [], bCaps = [], wScore = 0, bScore = 0;
    for (const h of engine.history) {
      if (h.move.captured) {
        const capColor = h.move.captured[0], capType = h.move.captured[1];
        if (capColor === 'b') { wCaps.push(symbols[capType]); wScore += vals[capType]; }
        else { bCaps.push(symbols[capType]); bScore += vals[capType]; }
      }
    }
    const diff = wScore - bScore;
    document.getElementById('bottom-captured').innerHTML = `${wCaps.join('')} ${diff > 0 ? `<span class="mat-diff">+${diff}</span>` : ''}`;
    document.getElementById('top-captured').innerHTML = `${bCaps.join('')} ${diff < 0 ? `<span class="mat-diff">+${Math.abs(diff)}</span>` : ''}`;
  }

  function formatClock(sec) {
    return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  }

  function startClocks() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (engine.gameOver || engine.history.length === 0) return;
      if (engine.turn === 'w') {
        whiteTime = Math.max(0, whiteTime - 1);
        if (whiteTime === 0) { engine.gameOver = true; engine.resultText = 'انتهى الوقت! فاز الأسود (0-1)'; updateUI(); }
      } else {
        blackTime = Math.max(0, blackTime - 1);
        if (blackTime === 0) { engine.gameOver = true; engine.resultText = 'انتهى الوقت! فاز الأبيض (1-0)'; updateUI(); }
      }
      const bEl = document.getElementById('bottom-clock'), tEl = document.getElementById('top-clock');
      bEl.textContent = formatClock(whiteTime);
      tEl.textContent = formatClock(blackTime);
      bEl.classList.toggle('low-time', whiteTime <= 20);
      tEl.classList.toggle('low-time', blackTime <= 20);
    }, 1000);
  }

  function resetGame() {
    engine.reset();
    selectedSquare = null;
    legalMovesForSelected = [];
    aiThinking = false;
    const baseSec = parseInt(document.getElementById('time-select').value, 10);
    whiteTime = baseSec;
    blackTime = baseSec;
    document.getElementById('bottom-clock').textContent = formatClock(whiteTime);
    document.getElementById('top-clock').textContent = formatClock(blackTime);
    document.getElementById('bottom-clock').classList.remove('low-time');
    document.getElementById('top-clock').classList.remove('low-time');

    const mode = document.getElementById('mode-select').value;
    if (mode === 'pvp') {
      document.getElementById('top-name').textContent = 'اللاعب الثاني';
      document.getElementById('top-elo').textContent = '1500';
      document.getElementById('top-avatar').textContent = '♟️';
    } else {
      const eloMap = { 'ai-1': '1100', 'ai-2': '1500', 'ai-3': '1800' };
      document.getElementById('top-name').textContent = 'Stockfish Engine';
      document.getElementById('top-elo').textContent = eloMap[mode];
      document.getElementById('top-avatar').textContent = '🤖';
    }
    updateUI();
    startClocks();
  }

  // Event Listeners
  document.getElementById('btn-new').addEventListener('click', resetGame);
  document.getElementById('mode-select').addEventListener('change', resetGame);
  document.getElementById('time-select').addEventListener('change', resetGame);

  document.getElementById('btn-undo').addEventListener('click', () => {
    if (!engine.history.length || aiThinking) return;
    const mode = document.getElementById('mode-select').value;
    const steps = (mode.startsWith('ai') && engine.turn === 'w' && engine.history.length >= 2) ? 2 : 1;
    for (let i = 0; i < steps; i++) {
      const last = engine.history.pop();
      if (last) { engine.restoreState(last.state); engine.pgnMoves.pop(); }
    }
    engine.gameOver = false;
    selectedSquare = null;
    legalMovesForSelected = [];
    updateUI();
  });

  document.getElementById('btn-flip').addEventListener('click', () => {
    flipped = !flipped;
    renderBoard();
  });

  document.getElementById('btn-pgn').addEventListener('click', () => {
    let pgn = '';
    for (let i = 0; i < engine.pgnMoves.length; i += 2) {
      pgn += `${Math.floor(i / 2) + 1}. ${engine.pgnMoves[i]} ${engine.pgnMoves[i + 1] || ''} `;
    }
    if (navigator.clipboard) navigator.clipboard.writeText(pgn.trim());
    const st = document.getElementById('game-status');
    const prev = st.textContent;
    st.textContent = 'تم نسخ PGN بنجاح!';
    setTimeout(() => { st.textContent = prev; }, 1800);
  });

  document.getElementById('btn-resign').addEventListener('click', () => {
    if (engine.gameOver) return;
    engine.gameOver = true;
    engine.resultText = engine.turn === 'w' ? 'استسلم الأبيض — فاز الأسود (0-1)' : 'استسلم الأسود — فاز الأبيض (1-0)';
    updateUI();
  });

  // Initialize immediately on load
  resetGame();
});
</script>
</body>
</html>
