<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jomo | جومو</title>
    
    <!-- Google Fonts: IBM Plex Sans Arabic, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"IBM Plex Sans Arabic"', '"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        // Gemini Matte Dark Palette
                        matte: {
                            bg: '#131314',
                            surface: '#1E1F20',
                            hover: '#282A2C',
                            active: '#333537',
                            border: '#333537',
                            borderSubtle: '#282A2C',
                            text: '#E3E3E3',
                            muted: '#9AA0A6',
                            accent: '#A8C7FA',
                        },
                        // Warm Paper Light Palette
                        paper: {
                            bg: '#F9F9F8',
                            surface: '#F0F0EE',
                            hover: '#E6E6E3',
                            active: '#DCDCD8',
                            border: '#E0E0DC',
                            text: '#1F1F1F',
                            muted: '#5F6368',
                            accent: '#0B57D0',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(4px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Marked.js for Markdown & Highlight.js for Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(154, 160, 166, 0.22);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(154, 160, 166, 0.4);
        }

        /* Editorial Markdown Typography */
        .markdown-body {
            line-height: 1.8;
            font-size: 0.975rem;
            word-wrap: break-word;
        }
        .markdown-body p {
            margin-bottom: 1rem;
        }
        .markdown-body p:last-child {
            margin-bottom: 0;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            line-height: 1.35;
            letter-spacing: -0.01em;
        }
        .markdown-body h1 { font-size: 1.45rem; }
        .markdown-body h2 { font-size: 1.22rem; }
        .markdown-body h3 { font-size: 1.08rem; }
        .markdown-body ul, .markdown-body ol {
            margin-bottom: 1rem;
            padding-inline-start: 1.5rem;
        }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body li { margin-bottom: 0.4rem; }
        .markdown-body blockquote {
            border-inline-start: 2px solid #9AA0A6;
            padding-inline-start: 1rem;
            margin: 1rem 0;
            opacity: 0.85;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.25rem 0;
            font-size: 0.9rem;
        }
        .markdown-body th, .markdown-body td {
            padding: 0.65rem 0.9rem;
            border: 1px solid #333537;
            text-align: start;
        }
        html:not(.dark) .markdown-body th, html:not(.dark) .markdown-body td {
            border-color: #E0E0DC;
        }
        .markdown-body th {
            background-color: rgba(154, 160, 166, 0.08);
            font-weight: 600;
        }
        .markdown-body :not(pre) > code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            padding: 0.15rem 0.4rem;
            border-radius: 0.375rem;
            background-color: rgba(154, 160, 166, 0.14);
            direction: ltr;
            display: inline-block;
        }
        .markdown-body pre {
            direction: ltr;
            text-align: left;
            margin: 1.15rem 0;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #18191A !important;
            border: 1px solid #333537;
        }
        .markdown-body pre code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.84rem;
            line-height: 1.65;
            padding: 1rem !important;
            display: block;
            overflow-x: auto;
        }

        /* Subtle Typing Dots */
        .typing-dot {
            animation: typingPulse 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingPulse {
            0%, 80%, 100% { opacity: 0.25; }
            40% { opacity: 0.9; }
        }
    </style>
</head>
<body class="bg-paper-bg text-paper-text dark:bg-matte-bg dark:text-matte-text font-sans antialiased selection:bg-matte-accent/20 overflow-hidden h-screen flex">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebarBackdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <!-- Matte Solid Sidebar -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 start-0 z-40 w-72 bg-paper-surface dark:bg-matte-surface border-e border-paper-border dark:border-matte-border flex flex-col transition-transform duration-200 ease-out translate-x-full lg:translate-x-0">
        
        <!-- Sidebar Top Bar -->
        <div class="h-14 px-4 flex items-center justify-between border-b border-paper-border dark:border-matte-borderSubtle">
            <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-paper-muted dark:text-matte-muted transition-colors" title="طي/توسيع القائمة">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
            </button>
            <span class="text-xs font-mono tracking-wider text-paper-muted dark:text-matte-muted">JOMO 3.1</span>
        </div>

        <!-- New Chat Action -->
        <div class="p-3">
            <button onclick="createNewChat()" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-paper-bg dark:bg-matte-bg hover:bg-paper-hover dark:hover:bg-matte-hover border border-paper-border dark:border-matte-border text-paper-text dark:text-matte-text font-medium text-sm transition-colors">
                <div class="flex items-center gap-2.5">
                    <svg class="w-4 h-4 text-paper-muted dark:text-matte-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    <span data-i18n="newChat">محادثة جديدة</span>
                </div>
                <kbd class="text-[11px] text-paper-muted dark:text-matte-muted font-mono hidden sm:inline">⌘K</kbd>
            </button>
        </div>

        <!-- Minimal Search Input -->
        <div class="px-3 mb-3">
            <div class="relative">
                <svg class="w-3.5 h-3.5 absolute top-1/2 -translate-y-1/2 start-3 text-paper-muted dark:text-matte-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
                <input id="chatSearchInput" type="text" oninput="renderChatList()" placeholder="البحث في المحادثات..." class="w-full bg-paper-bg dark:bg-matte-bg border border-paper-border dark:border-matte-border focus:border-paper-muted dark:focus:border-matte-muted rounded-lg py-1.5 ps-8 pe-3 text-xs text-paper-text dark:text-matte-text placeholder-paper-muted dark:placeholder-matte-muted focus:outline-none transition-colors">
            </div>
        </div>

        <!-- Chat History List -->
        <div class="flex-1 overflow-y-auto px-3 space-y-4" id="chatHistoryContainer">
            <!-- Populated dynamically -->
        </div>

        <!-- Sidebar Footer -->
        <div class="p-3 border-t border-paper-border dark:border-matte-border space-y-1">
            <button onclick="openSettingsModal()" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text hover:bg-paper-hover dark:hover:bg-matte-hover transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span data-i18n="settingsPersona">تخصيص جومو والإعدادات</span>
            </button>
            <div class="flex items-center gap-1.5 pt-1">
                <button onclick="toggleTheme()" class="flex-1 flex items-center justify-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text hover:bg-paper-hover dark:hover:bg-matte-hover border border-paper-border dark:border-matte-border transition-colors">
                    <svg id="themeIconSun" class="w-3.5 h-3.5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
                    <svg id="themeIconMoon" class="w-3.5 h-3.5 block dark:hidden" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
                    <span id="themeLabel">الوضع النهاري</span>
                </button>
                <button onclick="toggleLanguage()" class="px-3 py-1.5 rounded-lg text-xs font-mono font-medium text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text hover:bg-paper-hover dark:hover:bg-matte-hover border border-paper-border dark:border-matte-border transition-colors">
                    <span id="langToggleLabel">EN</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Workspace Wrapper -->
    <div class="flex-1 flex flex-col lg:flex-row h-full overflow-hidden relative">
        
        <!-- Primary Chat Column -->
        <main id="chatColumn" class="flex-1 flex flex-col h-full min-w-0 relative">
            
            <!-- Minimalist Top Header -->
            <header class="h-14 px-4 sm:px-6 flex items-center justify-between border-b border-paper-border dark:border-matte-borderSubtle bg-paper-bg dark:bg-matte-bg z-20 shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar(true)" class="p-2 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover lg:hidden text-paper-muted dark:text-matte-muted">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
                    </button>

                    <!-- Solid Minimalist Brand Mark -->
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-paper-text dark:text-matte-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>
                        </svg>
                        <span class="font-semibold text-base tracking-tight">Jomo</span>
                    </div>

                    <!-- Mode Selector Pill (Solid Matte) -->
                    <div class="relative ms-2">
                        <button onclick="toggleModeDropdown()" id="modeSelectorBtn" class="flex items-center gap-2 px-3 py-1 rounded-lg bg-paper-surface dark:bg-matte-surface hover:bg-paper-hover dark:hover:bg-matte-hover border border-paper-border dark:border-matte-border text-xs font-medium text-paper-text dark:text-matte-text transition-colors">
                            <span id="currentModeLabel">Jomo Pro</span>
                            <svg class="w-3.5 h-3.5 text-paper-muted dark:text-matte-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                        </button>

                        <!-- Solid Mode Dropdown Menu -->
                        <div id="modeDropdown" class="hidden absolute top-full start-0 mt-1.5 w-72 rounded-xl bg-paper-bg dark:bg-matte-surface border border-paper-border dark:border-matte-border p-1.5 z-50 animate-fade-in">
                            <button onclick="selectMode('pro')" class="w-full flex items-start gap-3 p-2.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-start transition-colors">
                                <svg class="w-4 h-4 text-paper-text dark:text-matte-text mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/></svg>
                                <div>
                                    <div class="text-xs font-semibold text-paper-text dark:text-matte-text">Jomo Pro</div>
                                    <p class="text-[11px] text-paper-muted dark:text-matte-muted mt-0.5 leading-relaxed">تفكير عميق، تحليل فلسفي وأكاديمي، وبرمجة معقدة.</p>
                                </div>
                            </button>

                            <button onclick="selectMode('flash')" class="w-full flex items-start gap-3 p-2.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-start transition-colors">
                                <svg class="w-4 h-4 text-paper-text dark:text-matte-text mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                <div>
                                    <div class="text-xs font-semibold text-paper-text dark:text-matte-text">Jomo Flash</div>
                                    <p class="text-[11px] text-paper-muted dark:text-matte-muted mt-0.5 leading-relaxed">استجابة فورية ومباشرة للمهام اليومية والترجمة.</p>
                                </div>
                            </button>

                            <button onclick="selectMode('canvas')" class="w-full flex items-start gap-3 p-2.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-start transition-colors">
                                <svg class="w-4 h-4 text-paper-text dark:text-matte-text mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/></svg>
                                <div>
                                    <div class="text-xs font-semibold text-paper-text dark:text-matte-text">Canvas Studio</div>
                                    <p class="text-[11px] text-paper-muted dark:text-matte-muted mt-0.5 leading-relaxed">كتابة الأكواد ومعاينتها مباشرة في مساحة عمل مقسمة.</p>
                                </div>
                            </button>

                            <button onclick="selectMode('image')" class="w-full flex items-start gap-3 p-2.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-start transition-colors">
                                <svg class="w-4 h-4 text-paper-text dark:text-matte-text mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>
                                <div>
                                    <div class="text-xs font-semibold text-paper-text dark:text-matte-text">استوديو الصور</div>
                                    <p class="text-[11px] text-paper-muted dark:text-matte-muted mt-0.5 leading-relaxed">توليد الصور والرسوم التوضيحية من الوصف النصي.</p>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right Header Actions -->
                <div class="flex items-center gap-2">
                    <button onclick="exportCurrentChat()" class="p-2 rounded-lg text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text hover:bg-paper-hover dark:hover:bg-matte-hover transition-colors" title="تصدير المحادثة (Markdown)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                    </button>
                    <button onclick="toggleCanvasPanel()" id="headerCanvasToggleBtn" class="flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-medium bg-paper-surface dark:bg-matte-surface hover:bg-paper-hover dark:hover:bg-matte-hover text-paper-text dark:text-matte-text border border-paper-border dark:border-matte-border transition-colors" title="فتح/إغلاق Canvas">
                        <svg class="w-3.5 h-3.5 text-paper-muted dark:text-matte-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/></svg>
                        <span>Canvas</span>
                    </button>
                </div>
            </header>

            <!-- Scrollable Chat Messages Area -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto px-4 sm:px-8 pt-8 pb-44 scroll-smooth">
                <div class="max-w-3xl mx-auto space-y-8" id="messagesList">
                    <!-- Quiet Minimalist Welcome State -->
                    <div id="welcomeHero" class="py-12 sm:py-20 flex flex-col items-start animate-fade-in">
                        <h1 class="text-2xl sm:text-4xl font-semibold tracking-tight text-paper-text dark:text-matte-text mb-2.5" data-i18n="heroGreeting">
                            أهلاً بك، أنا جومو.
                        </h1>
                        <p class="text-base sm:text-lg font-normal text-paper-muted dark:text-matte-muted mb-10" data-i18n="heroSubtitle">
                            مساحتك الهادئة للتفكير، البرمجة، والبحث. بماذا نبدأ اليوم؟
                        </p>

                        <!-- 4 Clean Solid Minimalist Prompts -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
                            <button onclick="useStarterPrompt('ابني لي تطبيق آلة حاسبة علمية بتصميم مسطح وأنيق في ملف HTML واحد.', 'canvas')" class="p-4 rounded-xl bg-paper-surface dark:bg-matte-surface hover:bg-paper-hover dark:hover:bg-matte-hover border border-paper-border dark:border-matte-border text-start transition-colors flex flex-col justify-between h-24">
                                <span class="text-sm font-medium text-paper-text dark:text-matte-text leading-snug">بناء تطبيق تفاعلي في ملف واحد مع معاينة حية</span>
                                <span class="text-[11px] font-mono text-paper-muted dark:text-matte-muted">Canvas Studio</span>
                            </button>

                            <button onclick="useStarterPrompt('تصميم معماري حديث لمكتبة هادئة مبنية من الحجر الطبيعي والخشب في الطبيعة، إضاءة نهارية طبيعية', 'image')" class="p-4 rounded-xl bg-paper-surface dark:bg-matte-surface hover:bg-paper-hover dark:hover:bg-matte-hover border border-paper-border dark:border-matte-border text-start transition-colors flex flex-col justify-between h-24">
                                <span class="text-sm font-medium text-paper-text dark:text-matte-text leading-snug">توليد تصور معماري لمكتبة هادئة وسط الطبيعة</span>
                                <span class="text-[11px] font-mono text-paper-muted dark:text-matte-muted">Image Studio</span>

                            <button onclick="useStarterPrompt('لخّص أهم مبادئ هندسة البرمجيات النظيفة (Clean Architecture) في جدول مقارن وموجز.', 'flash')" class="p-4 rounded-xl bg-paper-surface dark:bg-matte-surface hover:bg-paper-hover dark:hover:bg-matte-hover border border-paper-border dark:border-matte-border text-start transition-colors flex flex-col justify-between h-24">
                                <span class="text-sm font-medium text-paper-text dark:text-matte-text leading-snug">ملخص موجز لمبادئ Clean Architecture في جدول</span>

                            </button>
                        </div>

            </div>

            <!-- Solid Matte Input Composer -->
            <div class="absolute bottom-0 inset-x-0 bg-paper-bg dark:bg-matte-bg pt-3 pb-4 px-4 sm:px-8 z-20">
                <div class="max-w-3xl mx-auto">
                    
                    <!-- Attachment Preview Bar -->
                    <div id="attachmentPreviewContainer" class="hidden mb-2.5 flex items-center gap-3 p-2 rounded-xl bg-paper-surface dark:bg-matte-surface border border-paper-border dark:border-matte-border w-fit animate-fade-in">

                        <button onclick="clearAttachment()" class="p-1.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-paper-muted dark:text-matte-muted transition-colors" title="إزالة">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>

                    <!-- Solid Matte Input Box -->
                    <div class="rounded-2xl bg-paper-surface dark:bg-matte-surface border border-paper-border dark:border-matte-border focus-within:border-paper-muted dark:focus-within:border-matte-muted transition-colors">
                        <div class="flex items-end gap-1.5 p-2">
                            
                            <!-- Upload Image Button -->
                            <input type="file" id="imageFileInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                            <button onclick="document.getElementById('imageFileInput').click()" class="p-2.5 rounded-xl text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text hover:bg-paper-hover dark:hover:bg-matte-hover transition-colors shrink-0" title="إرفاق صورة">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13"/></svg>

                            <!-- Auto-Resizing Textarea -->
                            <textarea id="promptInput" rows="1" placeholder="اكتب رسالتك لجومو..." class="flex-1 bg-transparent border-0 focus:ring-0 focus:outline-none text-paper-text dark:text-matte-text placeholder-paper-muted dark:placeholder-matte-muted text-sm sm:text-base resize-none py-2 max-h-40 leading-relaxed" oninput="autoResizeTextarea(this)" onkeydown="handlePromptKeydown(event)"></textarea>

                            <!-- Voice Input Button -->
                            <button id="micBtn" onclick="toggleVoiceInput()" class="p-2.5 rounded-xl text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text hover:bg-paper-hover dark:hover:bg-matte-hover transition-colors shrink-0" title="الإملاء الصوتي">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/></svg>
                            </button>

                            <!-- Solid Monochrome Send / Stop Button -->
                            <button id="sendBtn" onclick="handleSendAction()" class="p-2.5 rounded-xl bg-paper-text text-paper-bg dark:bg-matte-text dark:text-matte-bg hover:opacity-85 transition-opacity shrink-0" title="إرسال">
                                <svg id="sendIcon" class="w-4 h-4 rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75"/></svg>
                                <svg id="stopIcon" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
                            </button>
                        </div>
                    </div>

                    <p class="text-[11px] text-center text-paper-muted dark:text-matte-muted mt-2">
                        قد يخطئ جومو أحياناً؛ يُرجى التحقق من المعلومات الدقيقة.
                    </p>
                </div>
            </div>
        </main>

        <!-- Split-Screen Canvas / Code Studio -->
        <section id="canvasPanel" class="hidden fixed inset-0 lg:static lg:w-[52%] xl:w-[55%] h-full bg-paper-bg dark:bg-matte-bg border-s border-paper-border dark:border-matte-border flex-col z-30">
            <!-- Canvas Toolbar -->
            <div class="h-14 px-4 flex items-center justify-between border-b border-paper-border dark:border-matte-border bg-paper-surface dark:bg-matte-surface shrink-0">
                <div class="flex items-center gap-2.5">
                    <span id="canvasTitle" class="text-xs font-semibold text-paper-text dark:text-matte-text">Canvas</span>
                    <span class="text-paper-border dark:text-matte-border">|</span>
                    <span id="canvasLangBadge" class="text-[11px] text-paper-muted dark:text-matte-muted font-mono">HTML</span>
                </div>

                <!-- View Switcher Tabs & Actions -->
                <div class="flex items-center gap-1.5">
                    <div class="flex bg-paper-bg dark:bg-matte-bg p-0.5 rounded-lg border border-paper-border dark:border-matte-border text-xs font-medium">
                        <button id="tabPreviewBtn" onclick="switchCanvasTab('preview')" class="px-2.5 py-1 rounded-md bg-paper-surface dark:bg-matte-active text-paper-text dark:text-matte-text transition-colors">معاينة</button>
                        <button id="tabCodeBtn" onclick="switchCanvasTab('code')" class="px-2.5 py-1 rounded-md text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text transition-colors">الكود</button>
                    </div>

                    <button onclick="copyCanvasCode()" class="p-1.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text transition-colors" title="نسخ الكود">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75"/></svg>
                    </button>

                    <button onclick="downloadCanvasFile()" class="p-1.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text transition-colors" title="تحميل الملف">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                    </button>

                    <button onclick="toggleCanvasPanel(false)" class="p-1.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text transition-colors" title="إغلاق">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <!-- Canvas Content Body -->
            <div class="flex-1 relative overflow-hidden bg-white dark:bg-[#18191A]">
                <iframe id="canvasIframe" sandbox="allow-scripts allow-modals allow-forms allow-same-origin" class="w-full h-full border-0 bg-white"></iframe>
                <div id="canvasCodeView" class="hidden w-full h-full overflow-auto p-5 font-mono text-xs sm:text-sm text-matte-text bg-[#18191A]" dir="ltr">
                    <pre><code id="canvasCodeBlock" class="language-html"></code></pre>
                </div>
            </div>
        </section>
    </div>

    <!-- Settings & Persona Modal (Solid Matte) -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
        <div class="bg-paper-bg dark:bg-matte-surface border border-paper-border dark:border-matte-border rounded-2xl max-w-lg w-full p-6 animate-fade-in">
            <div class="flex items-center justify-between pb-4 border-b border-paper-border dark:border-matte-border">
                <h2 class="text-base font-semibold text-paper-text dark:text-matte-text">إعدادات وتخصيص جومو</h2>
                <button onclick="closeSettingsModal()" class="p-1.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover text-paper-muted dark:text-matte-muted">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="space-y-4 my-5">
                <div>
                    <label class="block text-xs font-medium text-paper-muted dark:text-matte-muted mb-1.5">التعليمات المخصصة (System Instructions)</label>
                    <textarea id="customSystemPromptInput" rows="4" class="w-full rounded-xl bg-paper-surface dark:bg-matte-bg border border-paper-border dark:border-matte-border p-3 text-xs sm:text-sm text-paper-text dark:text-matte-text focus:outline-none focus:border-paper-muted dark:focus:border-matte-muted leading-relaxed"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-paper-muted dark:text-matte-muted mb-1.5">مفتاح Gemini API مخصص (اختياري)</label>
                    <input id="customApiKeyInput" type="password" dir="ltr" class="w-full rounded-xl bg-paper-surface dark:bg-matte-bg border border-paper-border dark:border-matte-border px-3.5 py-2 text-xs font-mono text-paper-text dark:text-matte-text focus:outline-none focus:border-paper-muted dark:focus:border-matte-muted" placeholder="AIzaSy...">
                </div>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-paper-border dark:border-matte-border">
                <button onclick="resetDefaultSettings()" class="text-xs text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text underline">استعادة الافتراضي</button>
                <div class="flex items-center gap-2">
                    <button onclick="closeSettingsModal()" class="px-4 py-2 rounded-lg text-xs font-medium bg-paper-surface dark:bg-matte-bg border border-paper-border dark:border-matte-border hover:bg-paper-hover dark:hover:bg-matte-hover">إلغاء</button>
                    <button onclick="saveSettings()" class="px-4 py-2 rounded-lg text-xs font-semibold bg-paper-text text-paper-bg dark:bg-matte-text dark:text-matte-bg hover:opacity-85">حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Minimalist Toast Notification Container -->
    <div id="toastContainer" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2"></div>

    <script>
        // ==========================================
        // 1. STATE & DEFAULT CONFIGURATION
        // ==========================================
        const DEFAULT_SYSTEM_PROMPT = `أنت "جومو" (Jomo)، نموذج ذكاء اصطناعي متطور للغاية، رصين، بليغ، وواسع المعرفة، تُعدّ الشقيق الذكي والمنافس المباشر لـ Gemini و Claude.
تتميز بقدرتك الفائقة على:
1. البرمجة وهندسة البرمجيات بجميع اللغات بأسلوب نظيف واحترافي، وعندما يُطلب منك بناء واجهة ويب أو تطبيق تفاعلي، تكتبه في كتلة كود HTML متكاملة (تحتوي على HTML و CSS و JS معاً) لكي تُعرض مباشرة في استوديو Canvas.
2. الكتابة الأكاديمية، التحليل الفلسفي العميق، السرد الإبداعي، والترجمة الاحترافية بين العربية والإنجليزية وكافة اللغات.
3. التنظيم البصري الهادئ في إجاباتك باستخدام العناوين، القوائم النقطية، الجداول المقارنة، والفقرات الواضحة دون حشو أو مبالغة.
تحدث بلغة المستخدم (العربية الفصحى المعاصرة السلسة إذا خاطبك بالعربية، أو الإنجليزية بطلاقة إذا خاطبك بالإنجليزية).`;

        let state = {
            chats: JSON.parse(localStorage.getItem('jomo_chats') || '[]'),
            currentChatId: null,
            mode: 'pro', // 'pro' | 'flash' | 'canvas' | 'image'
            theme: localStorage.getItem('jomo_theme') || 'dark',
            lang: localStorage.getItem('jomo_lang') || 'ar',
            systemPrompt: localStorage.getItem('jomo_system_prompt') || DEFAULT_SYSTEM_PROMPT,
            customApiKey: localStorage.getItem('jomo_api_key') || '',
            attachedImage: null,
            isGenerating: false,
            abortController: null,
            currentCanvasCode: '',
            currentCanvasLang: 'html',
            isRecording: false
        };

        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // ==========================================
        // 2. INITIALIZATION & UI HELPERS
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(state.theme);
            applyLanguage(state.lang);
            
            if (state.chats.length > 0) {
                loadChat(state.chats[0].id);
            } else {
                renderChatList();
            }

            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('modeDropdown');
                const btn = document.getElementById('modeSelectorBtn');
                if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    createNewChat();
                }
            });
        });

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'px-3.5 py-2 rounded-lg bg-matte-surface dark:bg-matte-text text-matte-text dark:text-matte-bg border border-matte-border text-xs font-medium animate-fade-in';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.2s';
                setTimeout(() => toast.remove(), 200);
            }, 2200);
        }

        function applyTheme(theme) {
            state.theme = theme;
            localStorage.setItem('jomo_theme', theme);
            const html = document.documentElement;
            const label = document.getElementById('themeLabel');
            if (theme === 'dark') {
                html.classList.add('dark');
                label.textContent = state.lang === 'ar' ? 'الوضع النهاري' : 'Light Mode';
            } else {
                html.classList.remove('dark');
                label.textContent = state.lang === 'ar' ? 'الوضع الداكن' : 'Dark Mode';
            }
        }

        function toggleTheme() {
            applyTheme(state.theme === 'dark' ? 'light' : 'dark');
        }

        function applyLanguage(lang) {
            state.lang = lang;
            localStorage.setItem('jomo_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langToggleLabel').textContent = lang === 'ar' ? 'EN' : 'عربي';
            
            const sidebar = document.getElementById('sidebar');
            if (lang === 'ar') {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-full', 'lg:translate-x-0');
            } else {
                sidebar.classList.remove('translate-x-full');
                sidebar.classList.add('-translate-x-full', 'lg:translate-x-0');
            }

            const dict = {
                ar: {
                    newChat: 'محادثة جديدة',
                    settingsPersona: 'تخصيص جومو والإعدادات',
                    heroGreeting: 'أهلاً بك، أنا جومو.',
                    heroSubtitle: 'مساحتك الهادئة للتفكير، البرمجة، والبحث. بماذا نبدأ اليوم؟',
                    searchPlaceholder: 'البحث في المحادثات...',
                    inputPlaceholder: 'اكتب رسالتك لجومو...'
                },
                en: {
                    newChat: 'New chat',
                    settingsPersona: 'Persona & settings',
                    heroGreeting: 'Hello, I am Jomo.',
                    heroSubtitle: 'Your quiet workspace for reasoning, code, and research. Where shall we begin?',
                    searchPlaceholder: 'Search conversations...',
                    inputPlaceholder: 'Message Jomo...'
                }
            };

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.textContent = dict[lang][key];
            });
            document.getElementById('chatSearchInput').placeholder = dict[lang].searchPlaceholder;
            document.getElementById('promptInput').placeholder = dict[lang].inputPlaceholder;
            applyTheme(state.theme);
        }

        function toggleLanguage() {
            applyLanguage(state.lang === 'ar' ? 'en' : 'ar');
        }

        function toggleSidebar(forceState) {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const isHidden = sidebar.classList.contains('translate-x-full') || sidebar.classList.contains('-translate-x-full');
            const shouldOpen = forceState !== undefined ? forceState : isHidden;

            if (shouldOpen) {
                sidebar.classList.remove('translate-x-full', '-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add(state.lang === 'ar' ? 'translate-x-full' : '-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function toggleModeDropdown() {
            document.getElementById('modeDropdown').classList.toggle('hidden');
        }

        function selectMode(mode) {
            state.mode = mode;
            document.getElementById('modeDropdown').classList.add('hidden');
            
            const labels = {
                pro: 'Jomo Pro',
                flash: 'Jomo Flash',
                canvas: 'Canvas Studio',
                image: 'استوديو الصور'
            };

            document.getElementById('currentModeLabel').textContent = labels[mode];

            if (mode === 'canvas') {
                toggleCanvasPanel(true);
            }
            showToast(`الوضع الحالي: ${labels[mode]}`);
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        }

        function handlePromptKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendAction();
            }
        }

        function useStarterPrompt(text, mode) {
            if (mode) selectMode(mode);
            const input = document.getElementById('promptInput');
            input.value = text;
            autoResizeTextarea(input);
            handleSendAction();
        }

        // ==========================================
        // 3. CHAT & WORKSPACE MANAGEMENT
        // ==========================================
        function saveChatsToStorage() {
            localStorage.setItem('jomo_chats', JSON.stringify(state.chats));
            renderChatList();
        }

        function createNewChat() {
            state.currentChatId = null;
            document.getElementById('messagesList').innerHTML = '';
            document.getElementById('messagesList').appendChild(createWelcomeHeroElement());
            renderChatList();
            if (window.innerWidth < 1024) toggleSidebar(false);
        }

        function createWelcomeHeroElement() {
            const div = document.createElement('div');
            div.id = 'welcomeHero';
            div.className = 'py-12 sm:py-20 flex flex-col items-start animate-fade-in';
            div.innerHTML = `
                <h1 class="text-2xl sm:text-4xl font-semibold tracking-tight text-paper-text dark:text-matte-text mb-2.5">
                    ${state.lang === 'ar' ? 'أهلاً بك، أنا جومو.' : 'Hello, I am Jomo.'}
                </h1>

        function loadChat(chatId) {
            const chat = state.chats.find(c => c.id === chatId);
            if (!chat) return;
            state.currentChatId = chatId;
            
            const list = document.getElementById('messagesList');
            list.innerHTML = '';
            chat.messages.forEach((msg, idx) => {
                appendMessageDOM(msg, idx);
            });
            renderChatList();
            scrollToBottom();
            if (window.innerWidth < 1024) toggleSidebar(false);
        }

        function togglePinChat(e, chatId) {
            e.stopPropagation();
            const chat = state.chats.find(c => c.id === chatId);
            if (chat) {
                chat.pinned = !chat.pinned;
                saveChatsToStorage();
            }
        }

        function deleteChat(e, chatId) {
            e.stopPropagation();
            state.chats = state.chats.filter(c => c.id !== chatId);
            if (state.currentChatId === chatId) {
                createNewChat();
            }
            saveChatsToStorage();
            showToast('تم حذف المحادثة');
        }

        function renderChatList() {
            const container = document.getElementById('chatHistoryContainer');
            const query = document.getElementById('chatSearchInput').value.trim().toLowerCase();
            
            const filtered = state.chats.filter(c => c.title.toLowerCase().includes(query));
            const pinned = filtered.filter(c => c.pinned);
            const recent = filtered.filter(c => !c.pinned);

            let html = '';

            if (pinned.length > 0) {
                html += `<div><div class="px-2.5 mb-1.5 text-[11px] font-medium text-paper-muted dark:text-matte-muted">المثبتة</div><div class="space-y-0.5">`;
                pinned.forEach(c => { html += renderChatItemHTML(c); });
                html += `</div></div>`;
            }

            if (recent.length > 0) {
                html += `<div><div class="px-2.5 mb-1.5 text-[11px] font-medium text-paper-muted dark:text-matte-muted">الأخيرة</div><div class="space-y-0.5">`;
                recent.forEach(c => { html += renderChatItemHTML(c); });
                html += `</div></div>`;
            }

            if (filtered.length === 0) {
                html = `<div class="text-center py-8 text-xs text-paper-muted dark:text-matte-muted">لا توجد محادثات</div>`;
            }

            container.innerHTML = html;
        }

        function exportCurrentChat() {
            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (!chat || chat.messages.length === 0) {
                showToast('لا توجد رسائل لتصديرها');
                return;
            }
            let md = `# ${chat.title}\n\n`;
            chat.messages.forEach(m => {
                md += `### ${m.role === 'user' ? 'المستخدم' : 'Jomo'}\n${m.text}\n\n---\n\n`;
            });
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `jomo-chat-${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('تم تصدير المحادثة بصيغة Markdown');
        }

        // ==========================================
        // 4. MULTIMODAL INPUT (IMAGE & VOICE)
        // ==========================================
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                const base64Data = dataUrl.split(',')[1];
                state.attachedImage = {
                    base64: base64Data,
                    mimeType: file.type,
                    name: file.name,
                    previewUrl: dataUrl
                };

                document.getElementById('attachmentThumb').src = dataUrl;
                document.getElementById('attachmentName').textContent = file.name;
                document.getElementById('attachmentPreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function clearAttachment() {
            state.attachedImage = null;
            document.getElementById('attachmentPreviewContainer').classList.add('hidden');
        }

        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast('المتصفح لا يدعم الإملاء الصوتي');
                return;
            }

            if (state.isRecording && state.recognition) {
                state.recognition.stop();
                return;
            }

            const recognition = new SpeechRecognition();
            state.recognition = recognition;
            recognition.lang = state.lang === 'ar' ? 'ar-SA' : 'en-US';
            recognition.interimResults = true;

            const micBtn = document.getElementById('micBtn');
            const input = document.getElementById('promptInput');

            recognition.onstart = () => {
                state.isRecording = true;
                micBtn.classList.add('bg-paper-active', 'dark:bg-matte-active', 'text-paper-text', 'dark:text-matte-text');
                showToast('جاري الاستماع...');
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                input.value = transcript;
                autoResizeTextarea(input);
            };

            recognition.onerror = () => {
                state.isRecording = false;
                micBtn.classList.remove('bg-paper-active', 'dark:bg-matte-active', 'text-paper-text', 'dark:text-matte-text');
            };

            recognition.onend = () => {
                state.isRecording = false;
                micBtn.classList.remove('bg-paper-active', 'dark:bg-matte-active', 'text-paper-text', 'dark:text-matte-text');
            };

            recognition.start();
        }

        // ==========================================
        // 5. GEMINI API INTEGRATION
        // ==========================================
        function setGeneratingUI(isGen) {
            state.isGenerating = isGen;
            const sendIcon = document.getElementById('sendIcon');
            const stopIcon = document.getElementById('stopIcon');
            if (isGen) {
                sendIcon.classList.add('hidden');
                stopIcon.classList.remove('hidden');
            } else {
                sendIcon.classList.remove('hidden');
                stopIcon.classList.add('hidden');
            }
        }

        async function handleSendAction() {
            if (state.isGenerating) {
                if (state.abortController) state.abortController.abort();
                setGeneratingUI(false);
                return;
            }

            const input = document.getElementById('promptInput');
            const text = input.value.trim();
            if (!text && !state.attachedImage) return;

            const hero = document.getElementById('welcomeHero');
            if (hero) hero.remove();

            if (!state.currentChatId) {
                const newChat = {
                    id: 'chat_' + Date.now(),
                    title: text ? text.slice(0, 42) : 'تحليل صورة',
                    pinned: false,
                    messages: []
                };
                state.chats.unshift(newChat);
                state.currentChatId = newChat.id;
            }

            const currentChat = state.chats.find(c => c.id === state.currentChatId);

            const userMsg = {
                role: 'user',
                text: text,
                image: state.attachedImage ? { ...state.attachedImage } : null,
                timestamp: Date.now()
            };

            currentChat.messages.push(userMsg);
            appendMessageDOM(userMsg, currentChat.messages.length - 1);

            input.value = '';
            input.style.height = 'auto';
            clearAttachment();
            saveChatsToStorage();
            scrollToBottom();

            await generateJomoResponse(currentChat);
        }

        async function fetchWithRetry(url, options, maxRetries = 3) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const res = await fetch(url, options);
                    if (res.status === 429 || res.status >= 500) {
                        throw new Error(`HTTP ${res.status}`);
                    }
                    return res;
                } catch (err) {
                    if (err.name === 'AbortError' || i === maxRetries - 1) throw err;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        async function generateJomoResponse(chat) {
            setGeneratingUI(true);
            state.abortController = new AbortController();

            const aiMsg = {
                role: 'model',
                text: '',
                generatedImage: null,
                isStreaming: true
            };
            chat.messages.push(aiMsg);
            const msgIndex = chat.messages.length - 1;
            const bubbleEl = appendMessageDOM(aiMsg, msgIndex);
            scrollToBottom();

            const apiKey = state.customApiKey.trim() || "";
            const lastUserMsg = chat.messages[msgIndex - 1];

            try {
                if (state.mode === 'image') {
                    const imgModel = 'gemini-3.1-flash-image';
                    const imgUrl = `https://generativelanguage.googleapis.com/v1beta/models/${imgModel}:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: [{
                            role: 'user',
                            parts: [{ text: lastUserMsg.text || "Generate an architectural minimalist illustration" }]
                        }],
                        generationConfig: {
                            responseModalities: ['TEXT', 'IMAGE']
                        }
                    };

                    const response = await fetchWithRetry(imgUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: state.abortController.signal
                    });

                    const result = await response.json();
                    if (result.error) throw new Error(result.error.message);

                    const parts = result?.candidates?.[0]?.content?.parts || [];
                    const imgPart = parts.find(p => p.inlineData);
                    const textPart = parts.find(p => p.text);

                    if (imgPart) {
                        aiMsg.generatedImage = `data:${imgPart.inlineData.mimeType || 'image/png'};base64,${imgPart.inlineData.data}`;
                        aiMsg.text = textPart ? textPart.text : 'تم توليد الصورة المطلوبة:';
                    } else {
                        aiMsg.text = textPart ? textPart.text : 'لم يتم توليد الصورة في هذه المحاولة.';
                    }

                    aiMsg.isStreaming = false;
                    updateMessageDOM(bubbleEl, aiMsg, msgIndex);
                } else {
                    const model = 'gemini-3-flash-preview';
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

                    const contents = chat.messages.slice(0, msgIndex).map(m => {
                        const parts = [];
                        if (m.text) parts.push({ text: m.text });
                        if (m.image && m.image.base64) {
                            parts.push({
                                inlineData: {
                                    mimeType: m.image.mimeType,
                                    data: m.image.base64
                                }
                            });
                        }
                        return {
                            role: m.role === 'user' ? 'user' : 'model',
                            parts: parts
                        };
                    });

                    let effectiveSystemPrompt = state.systemPrompt;
                    if (state.mode === 'canvas') {
                        effectiveSystemPrompt += `\nملاحظة الوضع الحالي (Canvas Studio): قدم الكود الكامل في كتلة كود واحدة واضحة (يفضل HTML متكامل يحتوي على CSS و JS) ليتم عرضه وتشغيله مباشرة في نافذة المعاينة.`;
                    } else if (state.mode === 'flash') {
                        effectiveSystemPrompt += `\nملاحظة الوضع الحالي (Jomo Flash): قدم إجابة موجزة، دقيقة، ومباشرة.`;
                    }

                    const payload = {
                        contents: contents,
                        systemInstruction: {
                            parts: [{ text: effectiveSystemPrompt }]
                        }
                    };

                    const response = await fetchWithRetry(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: state.abortController.signal
                    });

                    const result = await response.json();
                    if (result.error) throw new Error(result.error.message);

                    const fullText = result?.candidates?.[0]?.content?.parts?.[0]?.text || 'عذراً، لم يصلني رد واضح.';
                    
                    await streamTextEffect(bubbleEl, aiMsg, fullText, msgIndex);
                    extractAndOpenCanvasIfNeeded(fullText);
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    aiMsg.text += '\n\n*(تم إيقاف التوليد)*';
                } else {
                    aiMsg.text = `**تنبيه:** تعذر إتمام الطلب.\n\`${error.message}\``;
                }
                aiMsg.isStreaming = false;
                updateMessageDOM(bubbleEl, aiMsg, msgIndex);
            } finally {
                setGeneratingUI(false);
                saveChatsToStorage();
                scrollToBottom();
            }
        }

        async function streamTextEffect(bubbleEl, aiMsg, fullText, msgIndex) {
            const totalLen = fullText.length;
            const step = totalLen > 1200 ? 32 : totalLen > 400 ? 16 : 8;
            let currentIdx = 0;

            while (currentIdx < totalLen && state.isGenerating) {
                currentIdx = Math.min(currentIdx + step, totalLen);
                aiMsg.text = fullText.slice(0, currentIdx);
                updateMessageDOM(bubbleEl, aiMsg, msgIndex);
                scrollToBottom();
                await new Promise(r => setTimeout(r, 15));
            }

            aiMsg.text = fullText;
            aiMsg.isStreaming = false;
            updateMessageDOM(bubbleEl, aiMsg, msgIndex);
        }

        // ==========================================
        // 6. MINIMALIST MESSAGE RENDERING
        // ==========================================
        function detectDirection(text) {
            if (!text) return state.lang === 'ar' ? 'rtl' : 'ltr';
            const arabicPattern = /[\u0600-\u06FF]/;
            return arabicPattern.test(text.slice(0, 120)) ? 'rtl' : 'ltr';
        }

        function appendMessageDOM(msg, index) {
            const list = document.getElementById('messagesList');
            const wrapper = document.createElement('div');
            wrapper.className = 'animate-fade-in';
            list.appendChild(wrapper);
            updateMessageDOM(wrapper, msg, index);
            return wrapper;
        }

            const dir = detectDirection(msg.text);

            if (msg.role === 'user') {
                wrapper.innerHTML = `
                    <div class="flex justify-end">
                        <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl bg-paper-surface dark:bg-matte-surface border border-paper-border dark:border-matte-border px-4 py-3 text-paper-text dark:text-matte-text" dir="${dir}">

            if (msg.generatedImage) {

                        <a href="${msg.generatedImage}" download="jomo-image-${Date.now()}.png" class="absolute bottom-3 end-3 px-3 py-1.5 rounded-lg bg-matte-bg/90 text-matte-text border border-matte-border text-xs font-medium opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                            تحميل
                        </a>
                    </div>
                `;
            }

            const actionsHTML = !msg.isStreaming ? `
                <div class="flex items-center gap-1 mt-2 pt-1 text-paper-muted dark:text-matte-muted">
                    <button onclick="copyMessageText(${index})" class="p-1.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover hover:text-paper-text dark:hover:text-matte-text transition-colors" title="نسخ">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75"/></svg>
                    </button>
                    <button onclick="speakText(${index})" class="p-1.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover hover:text-paper-text dark:hover:text-matte-text transition-colors" title="استماع">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"/></svg>
                    </button>
                    <button onclick="regenerateResponse(${index})" class="p-1.5 rounded-lg hover:bg-paper-hover dark:hover:bg-matte-hover hover:text-paper-text dark:hover:text-matte-text transition-colors" title="إعادة التوليد">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                    </button>
                </div>
            ` : '';

            wrapper.innerHTML = `
                <div class="flex items-start gap-3.5">
                    <!-- Minimalist Solid Geometric Mark -->
                    <div class="w-7 h-7 rounded-lg bg-paper-surface dark:bg-matte-surface border border-paper-border dark:border-matte-border flex items-center justify-center shrink-0 mt-0.5 text-paper-text dark:text-matte-text">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>
                        </svg>
                    </div>

                    <!-- Message Body -->
                    <div class="flex-1 min-w-0">
                        ${contentHTML}
                        ${actionsHTML}
                    </div>
                </div>
            `;

            if (!msg.isStreaming) {
                enhanceCodeBlocks(wrapper);
            }
        }

        function enhanceCodeBlocks(container) {
            const preBlocks = container.querySelectorAll('pre');
            preBlocks.forEach((pre) => {
                if (pre.dataset.enhanced) return;
                pre.dataset.enhanced = 'true';

                const codeEl = pre.querySelector('code');
                const rawCode = codeEl ? codeEl.innerText : pre.innerText;
                let lang = 'code';
                if (codeEl && codeEl.className) {
                    const match = codeEl.className.match(/language-(\w+)/);
                    if (match) lang = match[1];
                }

                const header = document.createElement('div');
                header.className = 'flex items-center justify-between px-4 py-2 bg-[#1E1F20] border-b border-[#333537] text-xs text-matte-muted font-mono';
                header.innerHTML = `
                    <span class="uppercase text-[11px]">${lang}</span>
                    <div class="flex items-center gap-2">
                        <button class="open-canvas-btn px-2 py-0.5 rounded hover:bg-[#282A2C] text-matte-text transition-colors font-sans text-[11px]">
                            فتح في Canvas
                        </button>
                        <button class="copy-code-btn px-2 py-0.5 rounded hover:bg-[#282A2C] text-matte-muted hover:text-matte-text transition-colors font-sans text-[11px]">
                            نسخ
                        </button>
                    </div>
                `;

                header.querySelector('.copy-code-btn').onclick = () => {
                    copyToClipboard(rawCode);
                    showToast('تم نسخ الكود');
                };

                header.querySelector('.open-canvas-btn').onclick = () => {
                    openInCanvas(rawCode, lang);
                };

                pre.insertBefore(header, pre.firstChild);
            });
        }

        function copyMessageText(index) {
            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (chat && chat.messages[index]) {
                copyToClipboard(chat.messages[index].text);
                showToast('تم نسخ النص');
            }
        }

        function speakText(index) {
            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (!chat || !chat.messages[index]) return;

            window.speechSynthesis.cancel();
            const cleanText = chat.messages[index].text.replace(/```[\s\S]*?```/g, ' كود برمجي ').replace(/[#*`_]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = detectDirection(cleanText) === 'rtl' ? 'ar-SA' : 'en-US';
            window.speechSynthesis.speak(utterance);
            showToast('جاري القراءة الصوتية');
        }

        async function regenerateResponse(index) {
            if (state.isGenerating) return;
            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (!chat) return;

            chat.messages = chat.messages.slice(0, index);
            loadChat(chat.id);
            await generateJomoResponse(chat);
        }

        // ==========================================
        // 7. CANVAS / LIVE CODE STUDIO
        // ==========================================
        function toggleCanvasPanel(forceState) {
            const panel = document.getElementById('canvasPanel');
            const isHidden = panel.classList.contains('hidden');
            const shouldShow = forceState !== undefined ? forceState : isHidden;

            if (shouldShow) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        }

        function openInCanvas(code, lang = 'html') {
            state.currentCanvasCode = code;
            state.currentCanvasLang = lang;

            document.getElementById('canvasLangBadge').textContent = lang.toUpperCase();
            const codeBlock = document.getElementById('canvasCodeBlock');
            codeBlock.textContent = code;
            hljs.highlightElement(codeBlock);

            const iframe = document.getElementById('canvasIframe');
            let runnableHTML = code;

            if (lang === 'javascript' || lang === 'js') {
                runnableHTML = `<!DOCTYPE html><html><body style="font-family:monospace;padding:24px;background:#131314;color:#E3E3E3;"><pre id="out"></pre><script>const log = (...a) => document.getElementById('out').textContent += a.join(' ') + '\\n'; console.log = log; try { ${code} } catch(e) { log('Error:', e.message); }<\/script></body></html>`;
            } else if (lang === 'markdown' || lang === 'md') {
                runnableHTML = `<!DOCTYPE html><html dir="auto"><head><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet"></head><body style="font-family:'IBM Plex Sans Arabic',sans-serif;padding:32px;line-height:1.8;max-width:760px;margin:auto;color:#1F1F1F;background:#F9F9F8;">${marked.parse(code)}</body></html>`;
            }

            iframe.srcdoc = runnableHTML;
            toggleCanvasPanel(true);
            switchCanvasTab('preview');
        }

        function extractAndOpenCanvasIfNeeded(markdownText) {
            const codeBlockRegex = /```(html|xml|svg|javascript|js|markdown|md)?\n([\s\S]*?)```/i;
            const match = markdownText.match(codeBlockRegex);
            if (match && match[2]) {
                const lang = (match[1] || 'html').toLowerCase();
                const code = match[2].trim();
                if (state.mode === 'canvas' || code.includes('<html') || code.includes('<!DOCTYPE')) {
                    openInCanvas(code, lang);
                }
            }
        }

        function switchCanvasTab(tab) {
            const iframe = document.getElementById('canvasIframe');
            const codeView = document.getElementById('canvasCodeView');
            const previewBtn = document.getElementById('tabPreviewBtn');
            const codeBtn = document.getElementById('tabCodeBtn');

            if (tab === 'preview') {
                iframe.classList.remove('hidden');
                codeView.classList.add('hidden');
                previewBtn.className = 'px-2.5 py-1 rounded-md bg-paper-surface dark:bg-matte-active text-paper-text dark:text-matte-text transition-colors';
                codeBtn.className = 'px-2.5 py-1 rounded-md text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text transition-colors';
            } else {
                iframe.classList.add('hidden');
                codeView.classList.remove('hidden');
                codeBtn.className = 'px-2.5 py-1 rounded-md bg-paper-surface dark:bg-matte-active text-paper-text dark:text-matte-text transition-colors';
                previewBtn.className = 'px-2.5 py-1 rounded-md text-paper-muted dark:text-matte-muted hover:text-paper-text dark:hover:text-matte-text transition-colors';
            }
        }

        function copyCanvasCode() {
            if (!state.currentCanvasCode) return;
            copyToClipboard(state.currentCanvasCode);
            showToast('تم نسخ الكود');
        }

        function downloadCanvasFile() {
            if (!state.currentCanvasCode) return;
            const ext = state.currentCanvasLang === 'javascript' ? 'js' : state.currentCanvasLang || 'html';
            const blob = new Blob([state.currentCanvasCode], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `jomo-canvas.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ==========================================
        // 8. SETTINGS MODAL & UTILITIES
        // ==========================================
        function openSettingsModal() {
            document.getElementById('customSystemPromptInput').value = state.systemPrompt;
            document.getElementById('customApiKeyInput').value = state.customApiKey;
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            state.systemPrompt = document.getElementById('customSystemPromptInput').value.trim() || DEFAULT_SYSTEM_PROMPT;
            state.customApiKey = document.getElementById('customApiKeyInput').value.trim();
            localStorage.setItem('jomo_system_prompt', state.systemPrompt);
            localStorage.setItem('jomo_api_key', state.customApiKey);
            closeSettingsModal();
            showToast('تم حفظ الإعدادات');
        }

        function resetDefaultSettings() {
            document.getElementById('customSystemPromptInput').value = DEFAULT_SYSTEM_PROMPT;
            document.getElementById('customApiKeyInput').value = '';
            showToast('تمت استعادة الإعدادات الافتراضية');
        }

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
